[env]
framework = arduino
build_flags = 
  -Wall -Wextra
  -D CONFIG_ARDUHAL_LOG_COLORS
  -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_DEBUG
lib_deps = 
  esp32async/ESPAsyncWebServer@^3.12.1
  ; this repository as a real library (compiles src/ recursively, like an installed copy)
  WebSerial=symlink://.
upload_protocol = esptool
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, log2file

[platformio]
src_dir = examples/Demo
; src_dir = examples/Demo_AP

[env:esp32]
build_flags = ${env.build_flags}
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.34/platform-espressif32.zip
board = esp32-s3-devkitc-1
lib_deps = 
  esp32async/AsyncTCP@^3.5.0
  ${env.lib_deps}

[env:esp8266]
platform = espressif8266
board = huzzah
lib_deps = 
  esp32async/ESPAsyncTCP@^2.0.0
  ${env.lib_deps}

[env:picow]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipicow
framework = arduino
board_build.core = earlephilhower
lib_deps = 
  ayushsharma82/RPAsyncTCP@^1.3.2
  ${env.lib_deps}
lib_ignore = 
  lwIP_ESPHost

[env:pico2w]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2w
framework = arduino
board_build.core = earlephilhower
lib_deps = 
  ayushsharma82/RPAsyncTCP@^1.3.2
  ${env.lib_deps}
lib_ignore = 
  lwIP_ESPHost

;  ------------
;  Native unit tests (host): pio test -e native
;  ------------

[env:native]
platform = native
framework =
lib_compat_mode = off
lib_deps = throwtheswitch/Unity@^2.6.1
test_framework = unity
test_build_src = no
build_flags =
  -std=gnu++17 -Wall -Wextra
  -fsanitize=address,undefined -fno-omit-frame-pointer
  -D WSL_MAX_CLIENTS=4 -D WSL_WINDOW=2
build_unflags = -D CONFIG_ARDUHAL_LOG_COLORS

;  ------------
;  CI Workflows
;  ------------

[env:ci-esp8266]
platform = espressif8266
board = ${sysenv.PIO_BOARD}
lib_deps = 
  esp32async/ESPAsyncTCP@^2.0.0
  ${env.lib_deps}

[env:ci-esp32]
